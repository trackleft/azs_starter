      value: "<p><span class=\"lead\">This is an example of a Directory Page.</span></p>\r\n\r\n<p><span class=\"lead\">Modify this page to meet your needs. Delete our mascots, add your people.&nbsp;</span></p>\r\n\r\n<p><span class=\"lead\">Step by step directions for everything that you would want to do with this page are at the bottom of the page.</span></p>\r\n\r\n<p><span class=\"lead\">For more about people and how to use them on your site check out the documentation at <a href=\"https://quickstart.arizona.edu/\">quickstart.arizona.edu</a></span></p>\r\n\r\n<hr />\r\n<p>&nbsp;</p>\r\n"
