    -
      title: 'Editing this Page'
      body: "<p>You can edit this page by simply clicking&nbsp;<strong>Edit</strong>&nbsp;at the top of the page</p>\r\n"
      body_format: az_standard
      collapsed: true
    -
      title: 'Adding People to Your Directory'
      body: "<p>To add People to this page go to&nbsp;<strong>Content &gt; Add Content &gt; Person</strong></p>\r\n"
      body_format: az_standard
      collapsed: true
    -
      title: 'Editing People in Your Directory'
      body: "<p>You can&nbsp;edit any Person by clicking on the person, then clicking&nbsp;<strong>Edit&nbsp;</strong>at the top of that Person's page.</p>\r\n\r\n<p>You can also edit a&nbsp;Person by hovering over that Person and clicking the Edit icon (the pencil in the upper righthand corner), then selecting&nbsp;<strong>Edit.&nbsp;</strong></p>\r\n"
      body_format: az_standard
      collapsed: true
    -
      title: 'Removing People from Your Directory'
      body: "<p>You can delete any Person&nbsp;on this page by clicking on the&nbsp;person, then clicking&nbsp;<strong>Delete</strong>&nbsp;at the top of that Person's page.</p>\r\n\r\n<p>You can also delete a&nbsp;Person by hovering over that Person and clicking the Edit icon (the pencil in the upper righthand corner), then selecting&nbsp;<strong>Delete.&nbsp;</strong></p>\r\n"
      body_format: az_standard
      collapsed: true
    -
      title: 'Getting Rid of This Page'
      body: "<p>You can delete the page by clicking on&nbsp;<strong>Delete&nbsp;</strong>on top of the page.</p>\r\n"
      body_format: az_standard
      collapsed: true
    -
      title: 'Changing the Menu Link for this Page'
      body: "<ol>\r\n\t<li><strong>Edit</strong>&nbsp;this page</li>\r\n\t<li>Navigate to <strong>Menu Settings</strong>&nbsp;in the right sidebar</li>\r\n\t<li>Change the <strong>Menu Link Title</strong> as desired</li>\r\n\t<li>If you want to change the order of Menu Items, you can change the weight. Lower numbers will be on the left, higher numbers will be on the right.</li>\r\n</ol>\r\n"
      body_format: az_standard
      collapsed: true
