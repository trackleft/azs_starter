  field_az_text_area:
    -
      value: "<h1 class=\"text-align-center\"><span class=\"text-blue\"><strong>This is your front page!</strong></span></h1>\r\n\r\n<p>This page was built using a Page content item.</p>\r\n\r\n<p>You can add new pages by going to <strong>Manage</strong> &gt; <strong>Content</strong> &gt; <strong>Add Content</strong> &gt; <strong>Page</strong>.</p>\r\n\r\n<p>For more information on what you can do with your Arizona Site, visit <a href=\"https://quickstart.arizona.edu/\">quickstart.arizona.edu</a>.&nbsp;</p>\r\n"
      format: az_standard
