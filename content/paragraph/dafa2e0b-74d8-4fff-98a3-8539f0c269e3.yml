      value: "<p><span class=\"lead\">This is an example of an Events Page.</span></p>\r\n\r\n<p><span class=\"lead\">Modify this page to meet your needs. Delete the demo events and add your own!</span></p>\r\n\r\n<p><span class=\"lead\">Step by step directions for everything that you would want to do with this page are at the bottom of the page.</span></p>\r\n\r\n<p><span class=\"lead\">For more about Events and how to use them on your site, check out <a href=\"https://quickstart.arizona.edu/\">quickstart.arizona.edu</a></span></p>\r\n\r\n<hr />\r\n<p>&nbsp;</p>\r\n"
